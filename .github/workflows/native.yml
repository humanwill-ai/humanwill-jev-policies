name: Native hook binaries
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build all targets or repeat one failed target
        type: choice
        default: all
        options: [all, macos-x86_64, macos-arm64, windows-x86_64, linux-x86_64]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'windows-x86_64' && '[{"os":"windows-2025","target":"windows-x86_64"}]' || inputs.target == 'linux-x86_64' && '[{"os":"ubuntu-24.04","target":"linux-x86_64"}]' || inputs.target == 'macos-arm64' && '[{"os":"macos-15","target":"macos-arm64"}]' || inputs.target == 'macos-x86_64' && '[{"os":"macos-15-intel","target":"macos-x86_64"}]' || '[{"os":"macos-15-intel","target":"macos-x86_64"},{"os":"macos-15","target":"macos-arm64"},{"os":"windows-2025","target":"windows-x86_64"},{"os":"ubuntu-24.04","target":"linux-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'
      - name: Build, test and package on macOS or Windows
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install -r requirements.txt 'setuptools==84.0.0'
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/build_native.py --workdir artifacts/native --jobs 3
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          python scripts/verify_native_hook.py --binary "artifacts/native/bin/humanwill-hook-c$EXT" --probe "artifacts/native/bin/canonical-probe$EXT" --report artifacts/native/contract-verification.json
          if [ "$RUNNER_OS" != "Windows" ]; then
            python scripts/verify_native_service.py --binary artifacts/native/bin/humanwill-hook-c --report artifacts/native/service-verification.json
          fi
          python scripts/package_native.py --workdir artifacts/native --outdir artifacts/native-downloads
      - name: Build static Linux binary with musl and test on Alpine
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 sh -ec '
            apk add --no-cache build-base cmake python3 py3-pip perl linux-headers openssl ca-certificates git
            git config --global --add safe.directory /work
            python3 -m venv /tmp/native-test-python
            /tmp/native-test-python/bin/pip install -r requirements.txt setuptools==84.0.0
            /tmp/native-test-python/bin/pip install --no-deps --no-build-isolation -e .
            /tmp/native-test-python/bin/python scripts/build_native.py --workdir artifacts/native --jobs 3
            /tmp/native-test-python/bin/python scripts/verify_native_hook.py --binary artifacts/native/bin/humanwill-hook-c --probe artifacts/native/bin/canonical-probe --report artifacts/native/contract-verification.json
            /tmp/native-test-python/bin/python scripts/verify_native_service.py --binary artifacts/native/bin/humanwill-hook-c --report artifacts/native/service-verification.json
            apk info -vv > artifacts/native/alpine-inventory.txt
            /tmp/native-test-python/bin/python scripts/package_native.py --workdir artifacts/native --outdir artifacts/native-downloads
          '
          sudo chown -R "$(id -u):$(id -g)" artifacts/native artifacts/native-downloads
      - name: Test the same static Linux binary on the Ubuntu host
        if: runner.os == 'Linux'
        run: |
          python3 -m venv /tmp/native-ubuntu-test
          /tmp/native-ubuntu-test/bin/pip install -r requirements.txt setuptools==84.0.0
          /tmp/native-ubuntu-test/bin/pip install --no-deps --no-build-isolation -e .
          /tmp/native-ubuntu-test/bin/python scripts/verify_native_hook.py --binary artifacts/native/bin/humanwill-hook-c --probe artifacts/native/bin/canonical-probe --report artifacts/native-downloads/ubuntu-contract-verification.json
          /tmp/native-ubuntu-test/bin/python scripts/verify_native_service.py --binary artifacts/native/bin/humanwill-hook-c --report artifacts/native-downloads/ubuntu-service-verification.json
      - name: Retain exact binaries, checksums and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/native-downloads/
            artifacts/native/*verification*.json
            artifacts/native/build-manifest.json
            artifacts/native/alpine-inventory.txt
