name: Pinned host integration
on:
  push:
    branches: [main, work/service-gateway-hooks]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agentgateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          curl -fsSL https://github.com/agentgateway/agentgateway/releases/download/v1.5.0/agentgateway-linux-amd64 -o "$RUNNER_TEMP/agentgateway"
          echo "daca5cda76e8c5ab0c1a75912fecf2d6365095403f810db72029c49d14a37e7b  $RUNNER_TEMP/agentgateway" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/agentgateway"
          python tests/hosts/gateways.py agentgateway --binary "$RUNNER_TEMP/agentgateway"
      - name: Safe test report
        if: always()
        run: |
          cat artifacts/hosts/agentgateway.json 2>/dev/null || true
          tail -60 artifacts/hosts/agentgateway-enforce.log 2>/dev/null || true
  litellm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          python -m venv "$RUNNER_TEMP/litellm"
          "$RUNNER_TEMP/litellm/bin/pip" install 'litellm[proxy]==1.102.1'
          python tests/hosts/gateways.py litellm --binary "$RUNNER_TEMP/litellm/bin/litellm"
      - name: Safe test report
        if: always()
        run: |
          cat artifacts/hosts/litellm.json 2>/dev/null || true
          tail -30 artifacts/hosts/litellm-enforce.log 2>/dev/null || true
  copilot-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          npm install --prefix "$RUNNER_TEMP/copilot" @github/copilot@1.0.88
          python tests/hosts/copilot_cli.py --binary "$RUNNER_TEMP/copilot/node_modules/.bin/copilot"
      - name: Safe test report
        if: always()
        run: cat artifacts/hosts/copilot-cli.json 2>/dev/null || true
