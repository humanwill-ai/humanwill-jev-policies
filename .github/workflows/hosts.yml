name: Pinned host integration
on:
  push:
    branches: [main, work/service-gateway-hooks]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Host to validate (avoids unrelated jobs)
        type: choice
        options: [all, agentgateway, litellm, copilot-cli]
        default: all
permissions:
  contents: read
jobs:
  agentgateway:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'agentgateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          python -m pip install 'grpcio==1.84.0' 'protobuf==7.36.2' 'mcp==1.30.0'
          sha256sum dist/*.whl
          cp -R tests "$RUNNER_TEMP/tests"
          curl -fsSL https://github.com/agentgateway/agentgateway/releases/download/v1.5.0/agentgateway-linux-amd64 -o "$RUNNER_TEMP/agentgateway"
          echo "daca5cda76e8c5ab0c1a75912fecf2d6365095403f810db72029c49d14a37e7b  $RUNNER_TEMP/agentgateway" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/agentgateway"
          cd "$RUNNER_TEMP"
          python tests/hosts/gateways.py agentgateway --binary "$RUNNER_TEMP/agentgateway"
          python tests/hosts/tool_calls.py --host agentgateway --binary "$RUNNER_TEMP/agentgateway"
          python -m unittest discover -s tests -p test_agentgateway_mcp.py
          python tests/hosts/agentgateway_mcp_calls.py --binary "$RUNNER_TEMP/agentgateway"
      - name: Safe test report
        if: always()
        run: |
          cat "$RUNNER_TEMP"/artifacts/hosts/agentgateway.json 2>/dev/null || true
          cat "$RUNNER_TEMP"/artifacts/hosts/agentgateway-tool-calls-report.json 2>/dev/null || true
          cat "$RUNNER_TEMP"/artifacts/hosts/agentgateway-mcp-report.json 2>/dev/null || true
          tail -60 "$RUNNER_TEMP"/artifacts/hosts/agentgateway-mcp-enforce.log 2>/dev/null || true
          tail -30 "$RUNNER_TEMP"/artifacts/hosts/extmcp-enforce.log 2>/dev/null || true
          tail -30 "$RUNNER_TEMP"/artifacts/hosts/agentgateway-tools-enforce.log 2>/dev/null || true
          tail -60 "$RUNNER_TEMP"/artifacts/hosts/agentgateway-enforce.log 2>/dev/null || true
      - name: Retain Agentgateway artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentgateway-installed-host-evidence
          path: |
            dist/*.whl
            ${{ runner.temp }}/artifacts/hosts/agentgateway*.json
            ${{ runner.temp }}/artifacts/hosts/agentgateway-mcp-*.log
            ${{ runner.temp }}/artifacts/hosts/extmcp-*.log
          retention-days: 7
  litellm:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'litellm'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          sha256sum dist/*.whl
          cp -R tests "$RUNNER_TEMP/tests"
          python -m venv "$RUNNER_TEMP/litellm"
          "$RUNNER_TEMP/litellm/bin/pip" install 'litellm[proxy]==1.102.1'
          "$RUNNER_TEMP/litellm/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          python tests/hosts/gateways.py litellm --binary "$RUNNER_TEMP/litellm/bin/litellm"
          python tests/hosts/tool_calls.py --host litellm --binary "$RUNNER_TEMP/litellm/bin/litellm"
          "$RUNNER_TEMP/litellm/bin/python" tests/hosts/mcp_guardrail.py
          "$RUNNER_TEMP/litellm/bin/python" tests/hosts/mcp_calls.py --binary "$RUNNER_TEMP/litellm/bin/litellm"
      - name: Safe test report
        if: always()
        run: |
          cat "$RUNNER_TEMP"/artifacts/hosts/litellm.json 2>/dev/null || true
          cat "$RUNNER_TEMP"/artifacts/hosts/litellm-tool-calls-report.json 2>/dev/null || true
          cat "$RUNNER_TEMP"/artifacts/hosts/litellm-mcp-report.json 2>/dev/null || true
          tail -30 "$RUNNER_TEMP"/artifacts/hosts/litellm-enforce.log 2>/dev/null || true
      - name: Retain LiteLLM installed-host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litellm-installed-host-evidence
          path: |
            dist/*.whl
            ${{ runner.temp }}/artifacts/hosts/litellm*.json
          retention-days: 7
  copilot-cli:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'copilot-cli'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          sha256sum dist/*.whl
          cp -R tests "$RUNNER_TEMP/tests"
          npm install --prefix "$RUNNER_TEMP/copilot" @github/copilot@1.0.88
          cd "$RUNNER_TEMP"
          python tests/hosts/copilot_cli.py --binary "$RUNNER_TEMP/copilot/node_modules/.bin/copilot"
      - name: Safe test report
        if: always()
        run: cat "$RUNNER_TEMP"/artifacts/hosts/copilot-cli.json 2>/dev/null || true
      - name: Retain CLI installed-host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-installed-host-evidence
          path: |
            dist/*.whl
            ${{ runner.temp }}/artifacts/hosts/copilot-cli.json
          retention-days: 7
