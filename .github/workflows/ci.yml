name: Policy core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools and project
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint and test offline contracts
        run: |
          ruff check src tests evals scripts
          ruff format --check src tests evals scripts
          python -m unittest discover -s tests -v
          humanwill-policies validate examples/policies --json
      - name: Build source distribution and wheel
        run: python -m build --no-isolation
      - name: Verify exact artifacts outside checkout
        run: |
          python scripts/verify_artifacts.py --wheel dist/humanwill_policies-0.1.0a1-py3-none-any.whl --sdist dist/humanwill_policies-0.1.0a1.tar.gz --report artifacts/packaging/verification.json
      - name: Exercise service load and failure recovery offline
        run: python tests/hosts/service_operations.py
      - name: Build and exercise local container recipe
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        shell: bash
        run: |
          docker pull python:3.11-slim-bookworm
          CONTAINER_BASE=$(docker image inspect python:3.11-slim-bookworm --format '{{index .RepoDigests 0}}')
          docker build --build-arg PYTHON_IMAGE="$CONTAINER_BASE" --tag humanwill-policies:ci .
          docker image inspect humanwill-policies:ci --format '{{.Id}}'
          docker image inspect python:3.11-slim-bookworm --format '{{json .RepoDigests}}'
          CONTAINER_IMAGE=$(docker image inspect humanwill-policies:ci --format '{{.Id}}')
          docker run --rm --network none --entrypoint python \
            --mount type=bind,src="$PWD/scripts/container_inventory.py",dst=/tmp/container_inventory.py,readonly \
            humanwill-policies:ci /tmp/container_inventory.py \
            --base-image "$CONTAINER_BASE" --image-id "$CONTAINER_IMAGE" \
            > artifacts/packaging/container-inventory.json
          docker run --rm --network none --entrypoint sh --tmpfs /work:uid=65532,gid=65532 -w /work humanwill-policies:ci -ec '
            humanwill-policies init-demo demo
            humanwill-policies validate demo --config demo/config.yaml --json
            humanwill-policies evaluate demo --config demo/config.yaml --request demo/request.json --mock-answers demo/mock-answers.json --json
          '
      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: pip-audit --disable-pip --no-deps -r requirements.txt
      - name: Retain exact release packages and verification evidence
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-candidate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            artifacts/packaging/*.json
            artifacts/hosts/service-operations.json
