name: Offline foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools and project
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint and test offline contracts
        run: |
          ruff check src tests
          ruff format --check src tests
          python -m unittest discover -s tests -v
          humanwill-policies validate examples/policies --json
      - name: Build source distribution and wheel
        run: python -m build --no-isolation
      - name: Install and run demo outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install -r requirements.txt
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/humanwill-policies" init-demo demo
          "$RUNNER_TEMP/wheel-env/bin/humanwill-policies" validate demo --config demo/config.yaml --json
          "$RUNNER_TEMP/wheel-env/bin/humanwill-policies" preview demo --config demo/config.yaml --json
          "$RUNNER_TEMP/wheel-env/bin/humanwill-policies" schema request
      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: pip-audit --disable-pip --no-deps -r requirements.txt
