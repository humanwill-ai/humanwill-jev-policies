<!doctype html><html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'"><title>HumanWill real-workflow review</title>
<style>body{font:16px system-ui;max-width:1050px;margin:30px auto;padding:0 20px;background:#f5f7fa;color:#172233}article{background:white;border:1px solid #ddd;padding:20px;margin:18px 0;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui;background:#f2f4f8;padding:14px}select,input,button{font:inherit;margin:6px;padding:8px}header{position:sticky;top:0;background:#f5f7fa;padding:10px}label{display:inline-block}textarea{width:95%;min-height:50px}</style>
<header><h1>Review 50 real HumanWill requests</h1><p>Local file: nothing is uploaded. Expected outcomes must be reviewed before Jev results are shown. Context is a bounded visible-text excerpt, not the full model request.</p><button id="export">Export reviewed packet</button><span id="count"></span></header><main id="cases"></main>
<script id="packet" type="application/json">DATA</script><script>
const packet=JSON.parse(document.getElementById('packet').textContent);const key='humanwill-dogfood-'+packet.transcript_prefix_sha256;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved)for(const c of packet.cases)if(saved[c.request_sha256])c.review=saved[c.request_sha256]}catch(e){}
function persist(){try{localStorage.setItem(key,JSON.stringify(Object.fromEntries(packet.cases.map(c=>[c.request_sha256,c.review]))))}catch(e){}document.getElementById('count').textContent=packet.cases.filter(c=>c.review.status==='approved').length+' / '+packet.count+' reviewed'}
function node(tag,text,parent){let e=document.createElement(tag);e.textContent=text;parent.appendChild(e);return e}
for(const c of packet.cases){let a=node('article','',document.getElementById('cases'));node('h2',c.id+' · '+c.timestamp,a);
for(const [i,p] of c.request.content.entries()){node('strong',p.role+(i===c.request.content.length-1?' — request being assessed':' — prior context'),a);node('pre',p.text,a)}
for(const [title,field,choices] of [['Expected outcome','expected_decision',['pending','allow','block','evaluation_error']],['Review status','status',['pending','approved','exclude']]]){let l=node('label',title,a),s=document.createElement('select');for(const x of choices){let o=node('option',x,s);o.value=x}s.value=c.review[field]||'pending';s.onchange=()=>{c.review[field]=s.value==='pending'&&field==='expected_decision'?null:s.value;persist()};l.appendChild(s)}
node('p','Trusted facts: set only from the company-approved destination/source list and the operation actually identified. Unknown stays unknown; a user claim is not proof.',a);
for(const field of Object.keys(c.review.facts)){let l=node('label',field,a),s=document.createElement('select');for(const x of ['unknown','approved','unapproved']){let o=node('option',x,s);o.value=x}s.value=c.review.facts[field]===null?'unknown':c.review.facts[field]?'approved':'unapproved';s.onchange=()=>{c.review.facts[field]=s.value==='unknown'?null:s.value==='approved';persist()};l.appendChild(s)}
node('p','Reason / scope uncertainty / evidence supporting trusted facts:',a);let t=document.createElement('textarea');t.value=c.review.reason;t.oninput=()=>{c.review.reason=t.value;persist()};a.appendChild(t)}
persist();document.getElementById('export').onclick=()=>{if(packet.cases.some(c=>c.review.status==='approved'&&!c.review.expected_decision)){alert('Choose an expected outcome for every approved case.');return}const blob=new Blob([JSON.stringify(packet,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='humanwill-dogfood-reviewed.json';a.click();URL.revokeObjectURL(a.href)};
</script></html>
