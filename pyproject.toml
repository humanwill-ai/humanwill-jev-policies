[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "humanwill-policies"
version = "0.1.0.dev3"
description = "Company policy evaluation for AI gateways and coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0", "httpx==0.28.1", "starlette==1.7.0", "uvicorn==0.54.0"]

[project.scripts]
humanwill-policies = "humanwill_policies.cli:main"

[project.urls]
Repository = "https://github.com/humanwill-ai/humanwill-jev-policies"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanwill_policies = ["schemas/*.json", "demo/*.md", "demo/*.yaml", "demo/*.json", "demo/rules/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
